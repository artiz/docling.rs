# OpenAPI description of the docling-serve HTTP API. Served verbatim at
# /openapi.yaml, so a running server always describes itself — keep it in sync
# with `ConvertOptions` and the router in lib.rs.
openapi: 3.1.0
info:
  title: docling-serve
  description: |
    HTTP conversion API over [docling.rs](https://github.com/docling-project/docling.rs):
    documents (PDF, DOCX, XLSX, PPTX, HTML, EPUB, images, audio, video, …) to
    Markdown, docling `DoclingDocument` JSON, DocLang (`.dclx`) archives, or
    chunk records.

    Options may be sent as query parameters, multipart text fields, or JSON
    keys; a body value wins over the same option in the query string.
  version: 1.0.0
  license:
    name: MIT
    url: https://github.com/docling-project/docling.rs/blob/master/LICENSE
externalDocs:
  description: docling-serve README
  url: https://github.com/docling-project/docling.rs/tree/master/crates/docling-serve
servers:
  - url: /
    description: This server

paths:
  /v1/convert:
    post:
      summary: Convert a document
      description: |
        Upload a file (`multipart/form-data`) or point the server at a URL
        (`application/json`). The input format is selected by the filename's
        extension — the uploaded part's filename, `file_name`, or the last
        segment of the URL path.

        `to=md` streams the Markdown as it converts (chunked response);
        `to=dclx` returns the archive as a download; `to=images` skips
        conversion entirely and rasterizes a PDF's pages to PNG (base64 in
        JSON), honoring `pages` and `scale`.

        **Batch**: several `file` parts in one multipart request convert as a
        batch — the response is then `{"results": [...]}` with per-item
        status (one bad file fails its item, not the batch), regardless of
        `to`; binary dclx output is base64 in `dclx_base64`.

        **Confidence** (PDF/image ML conversions): every response carries an
        `X-Docling-Confidence` header with the document-level summary, and
        `to=json` bodies additionally embed the full report (per-page
        breakdown) under a top-level `confidence` key. Declarative
        conversions have no ML stages and omit both.
      operationId: convert
      parameters:
        - { $ref: "#/components/parameters/to" }
        - { $ref: "#/components/parameters/strict" }
        - { $ref: "#/components/parameters/images" }
        - { $ref: "#/components/parameters/no_ocr" }
        - { $ref: "#/components/parameters/force_full_page_ocr" }
        - { $ref: "#/components/parameters/no_table_former" }
        - { $ref: "#/components/parameters/no_text_panels" }
        - { $ref: "#/components/parameters/fetch_images" }
        - { $ref: "#/components/parameters/pages" }
        - { $ref: "#/components/parameters/scale" }
        - { $ref: "#/components/parameters/ocr_lang" }
        - { $ref: "#/components/parameters/asr_model" }
        - { $ref: "#/components/parameters/asr_lang" }
        - { $ref: "#/components/parameters/video_frames" }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The document. Its filename selects the input format.
                to: { $ref: "#/components/schemas/To" }
                strict: { type: boolean }
                images: { $ref: "#/components/schemas/Images" }
                no_ocr: { type: boolean }
                force_full_page_ocr: { type: boolean }
                no_table_former: { type: boolean }
                no_text_panels: { type: boolean }
                fetch_images: { type: boolean }
                pages: { type: string, examples: ["2-5"] }
                ocr_lang: { $ref: "#/components/schemas/OcrLang" }
                asr_model: { type: string }
                asr_lang: { type: string, examples: ["auto", "en", "de"] }
                video_frames: { type: integer, minimum: 0 }
          application/json:
            schema:
              allOf:
                - type: object
                  required: [url]
                  properties:
                    url:
                      type: string
                      format: uri
                      description: >
                        Source URL. Honored only when the server runs with
                        `--allow-url-fetch`, otherwise the request is rejected.
                    file_name:
                      type: string
                      description: Overrides the format-selecting name taken from the URL path.
                - $ref: "#/components/schemas/Options"
            examples:
              markdown:
                summary: URL to Markdown
                value: { url: "https://example.com/doc.pdf", to: "md" }
      responses:
        "200":
          description: The converted document.
          content:
            text/markdown:
              schema: { type: string }
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DoclingDocument"
                  - $ref: "#/components/schemas/Chunks"
            application/vnd.openxmlformats-officedocument.doclang:
              schema: { type: string, format: binary }
          headers:
            Content-Disposition:
              description: Present for `to=dclx` (attachment filename).
              schema: { type: string }
            X-Docling-Confidence:
              description: >
                Document-level conversion-confidence summary (compact JSON —
                the `ConfidenceReport` without its `pages` breakdown).
                Present when the PDF/image ML pipeline ran.
              schema: { type: string }
        "400":
          description: Bad request — unreadable input, invalid option, or a URL input on a server without `--allow-url-fetch`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: Payload larger than the server's `--max-body-bytes`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: Unsupported input format.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Conversion failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/convert/async:
    post:
      summary: Submit an async conversion job
      description: |
        Accepts exactly the `POST /v1/convert` request (including batches) but
        answers immediately with a task id instead of holding the connection
        for the duration of the conversion — submit → poll
        `GET /v1/status/{id}` → fetch `GET /v1/result/{id}`. Jobs queue on
        the same concurrency bound as sync requests and reuse the warm model
        pipeline. At most `--queue-size` jobs may be queued or unfetched at
        once; results are evicted `--result-ttl` seconds after completion.
      operationId: convertAsync
      responses:
        "202":
          description: The job was accepted and queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskStatus" }
        "400":
          description: Bad request (validated synchronously, nothing is queued).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: The job queue is full — retry after results are fetched or expire.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/status/{id}:
    get:
      summary: Async job status
      operationId: jobStatus
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The job's current state (`error` is set on failure).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskStatus" }
        "404":
          description: Unknown task id — never submitted, or its result already expired.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/result/{id}:
    get:
      summary: Async job result
      description: >
        The finished conversion, with the same body, content type, and headers
        the sync endpoint would have answered with (batches: the JSON results
        array). Stays fetchable until the TTL evicts it.
      operationId: jobResult
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The converted output (see `POST /v1/convert` responses).
        "202":
          description: Not finished yet — the status body is returned instead.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskStatus" }
        "404":
          description: Unknown task id — never submitted, or its result expired.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: The conversion failed; the stored error is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/config:
    get:
      summary: Server capabilities
      operationId: getConfig
      responses:
        "200":
          description: What this server allows; the built-in playground adapts to it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  allow_url_fetch:
                    type: boolean
                    description: Whether URL inputs and `fetch_images` are enabled.
                  models:
                    type: array
                    description: >
                      Which model file each ML pipeline stage would load right
                      now (resolved live: CWD-relative with env overrides).
                      When two servers convert the same PDF differently, diff
                      this list first.
                    items:
                      type: object
                      properties:
                        stage: { type: string, examples: [layout, tableformer.decoder, ocr.rec, pdfium] }
                        path: { type: string }
                        found: { type: boolean }
                        bytes: { type: integer, description: File size (0 when missing) — tells an int8 quant from an fp32 graph at a glance. }
                      required: [stage, path, found, bytes]
                required: [allow_url_fetch, models]

  /health:
    get:
      summary: Liveness probe
      operationId: health
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }

  /ready:
    get:
      summary: Readiness probe
      operationId: ready
      description: 503 until `--warmup` finishes loading the ML models; 200 immediately when the server runs without it.
      responses:
        "200":
          description: Ready to serve conversions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ready }
        "503":
          description: Still loading models.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: loading }

  /openapi.yaml:
    get:
      summary: This document
      operationId: openapi
      responses:
        "200":
          description: The OpenAPI description of the running server.
          content:
            application/yaml:
              schema: { type: string }

components:
  schemas:
    To:
      type: string
      enum: [md, json, dclx, chunks, images]
      default: md
      description: |
        `md` — Markdown, streamed as it converts.
        `json` — docling `DoclingDocument` JSON.
        `dclx` — DocLang OPC archive, returned as a download.
        `chunks` — chunker records (hierarchical, plus hybrid when a tokenizer is installed).
        `images` — PDF only: per-page PNG renders as
        `{"pages": [{"page", "width", "height", "png_base64"}]}` (no
        conversion, no models; capped at `DOCLING_RS_MAX_RASTER_PAGES`
        pages per request, default 100 — narrow with `pages=A-B`).
    Images:
      type: string
      enum: [placeholder, embedded]
      default: placeholder
      description: Markdown picture handling — `embedded` inlines base64 data URIs.
    OcrLang:
      type: string
      enum: [en, ch]
      default: en
      description: OCR recognition language for scanned pages.
    Scale:
      type: number
      minimum: 0.1
      maximum: 4.0
      default: 2.0
      description: >-
        `to=images` render scale in pixels per PDF point — 2.0 = 144 dpi,
        the ML pipeline's own render scale.
    Options:
      type: object
      description: Conversion options, shared by every transport.
      properties:
        to: { $ref: "#/components/schemas/To" }
        strict:
          type: boolean
          default: false
          description: Cleaner strict Markdown dialect instead of byte-for-byte docling-legacy output.
        images: { $ref: "#/components/schemas/Images" }
        no_ocr:
          type: boolean
          default: false
          description: PDF/image — skip layout/OCR/TableFormer; emit the embedded text layer only.
        force_full_page_ocr:
          type: boolean
          default: false
          description: PDF — OCR every page even when it carries a text layer.
        no_table_former:
          type: boolean
          default: false
          description: PDF/image — geometric table reconstruction instead of the TableFormer model.
        no_text_panels:
          type: boolean
          default: false
          description: >
            PDF/image — keep every detected picture as a picture: disable the
            demotion of uncaptioned dense-text "picture" regions into
            paragraphs (the escape hatch for image-extraction workflows).
        fetch_images:
          type: boolean
          default: false
          description: >
            HTML/EPUB — resolve external `<img src>` and embed the bytes.
            Outbound fetch; honored only with `--allow-url-fetch`.
        pages:
          type: string
          pattern: '^\d+(-\d+)?$'
          description: PDF page window, `A-B` or a single `N` (1-based, inclusive).
          examples: ["2-5", "3"]
        ocr_lang: { $ref: "#/components/schemas/OcrLang" }
        scale: { $ref: "#/components/schemas/Scale" }
        asr_model:
          type: string
          description: Audio/video — Whisper preset directory under `.models/asr/`.
        asr_lang:
          type: string
          description: >-
            Audio/video — transcription language: a Whisper code (`en`, `de`,
            `zh`, …) or `auto` (default) to detect it from the first 30
            seconds. English-only presets always transcribe English.
          examples: ["auto", "en", "de"]
        video_frames:
          type: integer
          minimum: 0
          description: Video — max frames sampled as pictures (0 = transcript only; needs ffmpeg on the server).
    DoclingDocument:
      type: object
      description: >
        docling-core's native document JSON (schema 1.10.0): a `body` tree of
        `$ref`s into `texts` / `groups` / `tables` / `pictures`. Loads back into
        Python docling-core via `DoclingDocument.load_from_json`.
      properties:
        schema_name: { type: string }
        version: { type: string }
        name: { type: string }
        body: { type: object }
        texts: { type: array, items: { type: object } }
        groups: { type: array, items: { type: object } }
        tables: { type: array, items: { type: object } }
        pictures: { type: array, items: { type: object } }
    Chunks:
      type: object
      description: Chunker output for `to=chunks`.
      properties:
        chunks:
          type: array
          items:
            type: object
            properties:
              text: { type: string }
              headings: { type: array, items: { type: string } }
    TaskStatus:
      type: object
      description: An async conversion job's state.
      properties:
        task_id: { type: string }
        task_status:
          type: string
          enum: [pending, started, success, failure]
        error:
          type: string
          description: Present when `task_status` is `failure`.
      required: [task_id, task_status]
    ConfidenceReport:
      type: object
      description: >
        Conversion-confidence scores (docling `ConfidenceReport` semantics):
        each score is 0–1 or null when its stage didn't run; grades bucket the
        aggregate (`poor` < 0.5 ≤ `fair` < 0.8 ≤ `good` < 0.9 ≤ `excellent`,
        `unspecified` when nothing scored). `pages` is keyed by the real
        1-based page number and carries the same fields per page.
      properties:
        layout_score: { type: [number, "null"], description: Mean confidence of the kept layout regions. }
        ocr_score: { type: [number, "null"], description: Mean recognition confidence of OCR'd cells. }
        parse_score: { type: [number, "null"], description: 10th-percentile text-layer extraction quality. }
        table_score: { type: [number, "null"], description: Reserved (never set — matches Python docling). }
        mean_score: { type: [number, "null"] }
        low_score: { type: [number, "null"] }
        mean_grade: { type: string, enum: [poor, fair, good, excellent, unspecified] }
        low_grade: { type: string, enum: [poor, fair, good, excellent, unspecified] }
        pages: { type: object, additionalProperties: { type: object } }
    Error:
      type: object
      properties:
        error: { type: string }
      required: [error]

  parameters:
    to:
      { name: to, in: query, schema: { $ref: "#/components/schemas/To" } }
    strict:
      { name: strict, in: query, schema: { type: boolean } }
    images:
      { name: images, in: query, schema: { $ref: "#/components/schemas/Images" } }
    no_ocr:
      { name: no_ocr, in: query, schema: { type: boolean } }
    force_full_page_ocr:
      { name: force_full_page_ocr, in: query, schema: { type: boolean } }
    no_table_former:
      { name: no_table_former, in: query, schema: { type: boolean } }
    no_text_panels:
      { name: no_text_panels, in: query, schema: { type: boolean } }
    fetch_images:
      { name: fetch_images, in: query, schema: { type: boolean } }
    pages:
      { name: pages, in: query, schema: { type: string }, example: "2-5" }
    scale:
      { name: scale, in: query, schema: { $ref: "#/components/schemas/Scale" } }
    ocr_lang:
      { name: ocr_lang, in: query, schema: { $ref: "#/components/schemas/OcrLang" } }
    asr_model:
      { name: asr_model, in: query, schema: { type: string } }
    asr_lang:
      { name: asr_lang, in: query, schema: { type: string } }
    video_frames:
      { name: video_frames, in: query, schema: { type: integer, minimum: 0 } }
