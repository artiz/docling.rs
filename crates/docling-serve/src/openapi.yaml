# OpenAPI description of the docling-serve HTTP API. Served verbatim at
# /openapi.yaml, so a running server always describes itself — keep it in sync
# with `ConvertOptions` and the router in lib.rs.
openapi: 3.1.0
info:
  title: docling-serve
  description: |
    HTTP conversion API over [docling.rs](https://github.com/docling-project/docling.rs):
    documents (PDF, DOCX, XLSX, PPTX, HTML, EPUB, images, audio, video, …) to
    Markdown, docling `DoclingDocument` JSON, DocLang (`.dclx`) archives,
    LaTeX, HTML, Pandoc AST JSON, or chunk records.

    Options may be sent as query parameters, multipart text fields, or JSON
    keys; a body value wins over the same option in the query string.

    Python docling-serve's own routes (`/v1/convert/file`, `/v1/convert/source`,
    their `/async` variants, `/v1/status/poll/{id}`, `/v1alpha/…`) are served
    too, in upstream's request and response shapes (#615). With `--api-key`
    (or `DOCLING_SERVE_API_KEY`) set, every `/v1` route needs `X-Api-Key`.
  version: 1.0.0
  license:
    name: MIT
    url: https://github.com/docling-project/docling.rs/blob/master/LICENSE
externalDocs:
  description: docling-serve README
  url: https://github.com/docling-project/docling.rs/tree/master/crates/docling-serve
servers:
  - url: /
    description: This server

paths:
  /v1/convert:
    post:
      summary: Convert a document
      description: |
        Upload a file (`multipart/form-data`) or point the server at a URL
        (`application/json`). The input format is selected by the filename's
        extension — the uploaded part's filename, `file_name`, or the last
        segment of the URL path.

        `to=md` streams the Markdown as it converts (chunked response);
        `to=dclx` returns the archive as a download; `to=images` skips
        conversion entirely and rasterizes a PDF's pages to PNG (base64 in
        JSON), honoring `pages` and `scale`.

        **Batch**: several `file` parts in one multipart request convert as a
        batch — the response is then `{"results": [...]}` with per-item
        status (one bad file fails its item, not the batch), regardless of
        `to`; binary dclx output is base64 in `dclx_base64`. A `.zip` file
        (upload, `sources[]` file item or cloud object) is such a batch of
        the documents inside it (#557); entries that do not convert —
        unsupported types, nested archives, unsafe paths, over the
        `DOCLING_RS_ZIP_MAX_*` limits — are left out (and logged), and an
        archive with nothing convertible is a 400.

        **Confidence** (PDF/image ML conversions): every response carries an
        `X-Docling-Confidence` header with the document-level summary, and
        `to=json` bodies additionally embed the full report (per-page
        breakdown) under a top-level `confidence` key. Declarative
        conversions have no ML stages and omit both.
      operationId: convert
      parameters:
        - { $ref: "#/components/parameters/to" }
        - { $ref: "#/components/parameters/strict" }
        - { $ref: "#/components/parameters/images" }
        - { $ref: "#/components/parameters/no_ocr" }
        - { $ref: "#/components/parameters/skip_ocr" }
        - { $ref: "#/components/parameters/text_layer_only" }
        - { $ref: "#/components/parameters/password" }
        - { $ref: "#/components/parameters/pdf_password" }
        - { $ref: "#/components/parameters/force_full_page_ocr" }
        - { $ref: "#/components/parameters/no_table_former" }
        - { $ref: "#/components/parameters/no_text_panels" }
        - { $ref: "#/components/parameters/heading_hierarchy" }
        - { $ref: "#/components/parameters/do_picture_classification" }
        - { $ref: "#/components/parameters/do_code_enrichment" }
        - { $ref: "#/components/parameters/do_formula_enrichment" }
        - { $ref: "#/components/parameters/do_picture_ocr" }
        - { $ref: "#/components/parameters/picture_ocr_classes" }
        - { $ref: "#/components/parameters/picture_ocr_min_side" }
        - { $ref: "#/components/parameters/keep_picture_images" }
        - { $ref: "#/components/parameters/redact_pii" }
        - { $ref: "#/components/parameters/redact_mode" }
        - { $ref: "#/components/parameters/redact_kinds" }
        - { $ref: "#/components/parameters/redact_pattern" }
        - { $ref: "#/components/parameters/redact_images" }
        - { $ref: "#/components/parameters/fetch_images" }
        - { $ref: "#/components/parameters/image_sources" }
        - { $ref: "#/components/parameters/image_hosts" }
        - { $ref: "#/components/parameters/max_images" }
        - { $ref: "#/components/parameters/max_image_bytes" }
        - { $ref: "#/components/parameters/max_image_total_mb" }
        - { $ref: "#/components/parameters/min_image_bytes" }
        - { $ref: "#/components/parameters/skip_empty_cells" }
        - { $ref: "#/components/parameters/compact_tables" }
        - { $ref: "#/components/parameters/page_break_placeholder" }
        - { $ref: "#/components/parameters/md_page_break_placeholder" }
        - { $ref: "#/components/parameters/pandoc_api_version" }
        - { $ref: "#/components/parameters/list_attachments" }
        - { $ref: "#/components/parameters/ebcdic_layout" }
        - { $ref: "#/components/parameters/pages" }
        - { $ref: "#/components/parameters/scale" }
        - { $ref: "#/components/parameters/ocr_lang" }
        - { $ref: "#/components/parameters/ocr_mode" }
        - { $ref: "#/components/parameters/ocr_scale" }
        - { $ref: "#/components/parameters/ocr_engine" }
        - { $ref: "#/components/parameters/images_scale" }
        - { $ref: "#/components/parameters/page_images" }
        - { $ref: "#/components/parameters/document_timeout" }
        - { $ref: "#/components/parameters/use_web_browser" }
        - { $ref: "#/components/parameters/asr_model" }
        - { $ref: "#/components/parameters/asr_lang" }
        - { $ref: "#/components/parameters/encoding" }
        - { $ref: "#/components/parameters/video_frames" }
        - { $ref: "#/components/parameters/video_scene_threshold" }
        - { $ref: "#/components/parameters/video_frame_max_side" }
        - { $ref: "#/components/parameters/video_frame_dedupe" }
        - { $ref: "#/components/parameters/xbrl_taxonomy" }
        - { $ref: "#/components/parameters/chunker" }
        - { $ref: "#/components/parameters/chunk_tokenizer" }
        - { $ref: "#/components/parameters/chunk_max_tokens" }
        - { $ref: "#/components/parameters/chunk_merge_peers" }
        - { $ref: "#/components/parameters/pipeline" }
        - { $ref: "#/components/parameters/vlm_endpoint" }
        - { $ref: "#/components/parameters/vlm_model" }
        - { $ref: "#/components/parameters/vlm_api_key" }
        - { $ref: "#/components/parameters/vlm_prompt" }
        - { $ref: "#/components/parameters/vlm_max_tokens" }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The document. Its filename selects the input format.
                to: { $ref: "#/components/schemas/To" }
                strict: { type: boolean }
                images: { $ref: "#/components/schemas/Images" }
                no_ocr: { type: boolean }
                skip_ocr: { type: boolean, deprecated: true }
                text_layer_only: { type: boolean }
                password: { type: string, format: password }
                pdf_password: { type: string, format: password, description: "Alias of password." }
                force_full_page_ocr: { type: boolean }
                no_table_former: { type: boolean }
                no_text_panels: { type: boolean }
                heading_hierarchy: { type: boolean }
                do_picture_classification: { type: boolean }
                do_code_enrichment: { type: boolean }
                do_formula_enrichment: { type: boolean }
                do_picture_ocr: { type: boolean }
                picture_ocr_classes: { type: string }
                picture_ocr_min_side: { type: integer }
                keep_picture_images: { type: boolean }
                redact_pii: { type: boolean }
                redact_mode: { type: string }
                redact_kinds: { type: string }
                redact_pattern: { type: string }
                redact_images: { type: string }
                fetch_images: { type: boolean }
                image_sources: { $ref: "#/components/schemas/ImageSources" }
                image_hosts: { oneOf: [{ type: array, items: { type: string } }, { type: string }] }
                max_images: { type: integer, minimum: 0 }
                max_image_bytes: { type: integer, minimum: 1 }
                max_image_total_mb: { type: integer, minimum: 0 }
                min_image_bytes: { type: integer, minimum: 0 }
                skip_empty_cells: { type: boolean }
                compact_tables: { type: boolean }
                list_attachments: { type: boolean }
                ebcdic_layout: { type: string }
                page_break_placeholder: { type: string, examples: ["<!-- page break -->"] }
                md_page_break_placeholder: { type: string, description: "Alias of page_break_placeholder." }
                pandoc_api_version: { type: string, examples: ["1.23"] }
                pages: { type: string, examples: ["2-5"] }
                ocr_lang: { $ref: "#/components/schemas/OcrLang" }
                ocr_mode: { $ref: "#/components/schemas/OcrMode" }
                ocr_scale: { $ref: "#/components/schemas/OcrScale" }
                ocr_engine: { $ref: "#/components/schemas/OcrEngine" }
                images_scale: { $ref: "#/components/schemas/ImagesScale" }
                page_images: { type: boolean }
                document_timeout: { type: number, exclusiveMinimum: 0, examples: [90] }
                use_web_browser: { type: boolean }
                asr_model: { type: string }
                asr_lang: { type: string, examples: ["auto", "en", "de"] }
                encoding: { type: string, examples: ["shift_jis", "koi8-r", "windows-1251"] }
                video_frames: { oneOf: [{ type: integer, minimum: 0 }, { type: string, enum: ["all"] }] }
                video_scene_threshold: { type: number, minimum: 0, maximum: 1 }
                video_frame_max_side: { type: integer, minimum: 0 }
                video_frame_dedupe: { type: integer, minimum: 0, maximum: 64 }
                xbrl_taxonomy: { type: string }
                chunker: { $ref: "#/components/schemas/Chunker" }
                chunk_tokenizer: { type: string }
                chunk_max_tokens: { type: integer, minimum: 1 }
                chunk_merge_peers: { type: boolean }
                pipeline: { $ref: "#/components/schemas/Pipeline" }
                vlm_endpoint: { type: string, format: uri }
                vlm_model: { type: string }
                vlm_api_key: { type: string }
                vlm_prompt: { type: string }
                vlm_max_tokens: { type: integer, minimum: 1 }
          application/json:
            schema:
              allOf:
                - type: object
                  properties:
                    url:
                      type: string
                      format: uri
                      description: >
                        Source URL shorthand (mutually exclusive with `sources`).
                        Honored only when the server runs with
                        `--allow-url-fetch`, otherwise the request is rejected.
                    file_name:
                      type: string
                      description: Overrides the format-selecting name taken from the URL path.
                    sources:
                      type: array
                      minItems: 1
                      items: { $ref: "#/components/schemas/SourceSpec" }
                      description: >
                        docling service-datamodel sources (#139) — mutually
                        exclusive with `url`. `http` and the cloud kinds need
                        `--allow-url-fetch`; cloud kinds additionally need a
                        server built with the `cloud` cargo feature.
                    target:
                      $ref: "#/components/schemas/TargetSpec"
                - $ref: "#/components/schemas/Options"
            examples:
              markdown:
                summary: URL to Markdown
                value: { url: "https://example.com/doc.pdf", to: "md" }
              s3_pipeline:
                summary: Convert an S3 prefix into another S3 prefix (#139)
                value:
                  sources:
                    - { kind: s3, endpoint: "s3.us-east-2.amazonaws.com",
                        access_key: "…", secret_key: "…", bucket: "in",
                        key_prefix: "reports/", max_num_elements: 25 }
                  target:
                    { kind: s3, endpoint: "s3.us-east-2.amazonaws.com",
                      access_key: "…", secret_key: "…", bucket: "out",
                      key_prefix: "converted/" }
                  to: "json"
      responses:
        "200":
          description: The converted document.
          content:
            text/markdown:
              schema: { type: string }
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DoclingDocument"
                  - $ref: "#/components/schemas/Chunks"
                  - $ref: "#/components/schemas/PandocAst"
            application/vnd.openxmlformats-officedocument.doclang:
              schema: { type: string, format: binary }
            text/x-tex:
              schema: { type: string }
            application/zip:
              schema: { type: string, format: binary }
          headers:
            Content-Disposition:
              description: "Present for `to=dclx` and `target: {kind: zip}` (attachment filename)."
              schema: { type: string }
            X-Docling-Confidence:
              description: >
                Document-level conversion-confidence summary (compact JSON —
                the `ConfidenceReport` without its `pages` breakdown).
                Present when the PDF/image ML pipeline ran.
              schema: { type: string }
        "400":
          description: Bad request — unreadable input, invalid option, or a URL input on a server without `--allow-url-fetch`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: Payload larger than the server's `--max-body-bytes`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: Unsupported input format.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Conversion failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/convert/async:
    post:
      summary: Submit an async conversion job
      description: |
        Accepts exactly the `POST /v1/convert` request (including batches) but
        answers immediately with a task id instead of holding the connection
        for the duration of the conversion — submit → poll
        `GET /v1/status/{id}` → fetch `GET /v1/result/{id}`. Jobs queue on
        the same concurrency bound as sync requests and reuse the warm model
        pipeline. At most `--queue-size` jobs may be queued or unfetched at
        once; results are evicted `--result-ttl` seconds after completion.
      operationId: convertAsync
      responses:
        "202":
          description: The job was accepted and queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskStatus" }
        "400":
          description: Bad request (validated synchronously, nothing is queued).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: The job queue is full — retry after results are fetched or expire.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/status/{id}:
    get:
      summary: Async job status
      operationId: jobStatus
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The job's current state (`error` is set on failure).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskStatus" }
        "404":
          description: Unknown task id — never submitted, or its result already expired.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/result/{id}:
    get:
      summary: Async job result
      description: >
        The finished conversion, with the same body, content type, and headers
        the sync endpoint would have answered with (batches: the JSON results
        array). Stays fetchable until the TTL evicts it.
      operationId: jobResult
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The converted output (see `POST /v1/convert` responses).
        "202":
          description: Not finished yet — the status body is returned instead.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskStatus" }
        "404":
          description: Unknown task id — never submitted, or its result expired.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: The conversion failed; the stored error is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/convert/file:
    post:
      summary: Convert uploads — upstream docling-serve's API (#615)
      description: |
        Python docling-serve's route, for the clients written against it
        (Open WebUI, n8n, Dify, LangChain's docling-serve client). Uploads go
        in repeatable `files` parts; options are upstream's names
        (`UpstreamOptions`) as form fields, a list option one field per item.
        Options with no equivalent here are accepted and ignored. One document
        answers a `ConvertDocumentResponse`; several (or `target_type=zip`) a
        zip of `<stem>.<ext>` outputs. A document that fails to convert is a
        200 with `status: failure`. Also served at `/v1alpha/convert/file`.
      operationId: compatConvertFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
                - type: object
                  properties:
                    files:
                      type: array
                      items: { type: string, format: binary }
                  required: [files]
                - $ref: "#/components/schemas/UpstreamOptions"
      responses:
        "200":
          description: The conversion (a failed document included).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConvertDocumentResponse" }
            application/zip:
              schema: { type: string, format: binary }
        "400":
          description: Malformed request (no `files` part, unreadable option value).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: An API key is configured and `X-Api-Key` is missing or wrong.

  /v1/convert/source:
    post:
      summary: Convert URL / base64 sources — upstream docling-serve's API (#615)
      description: |
        `sources` are `kind`-tagged: `{"kind": "file", "base64_string",
        "filename"}` always, `{"kind": "http", "url", "headers"}` with
        `--allow-url-fetch`; docling-serve 0.x's `file_sources` /
        `http_sources` lists are read too. `options` holds `UpstreamOptions`;
        `target` is `{"kind": "inbody"}` (default) or `{"kind": "zip"}`. Also
        served at `/v1alpha/convert/source`.
      operationId: compatConvertSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sources: { type: array, items: { type: object } }
                file_sources: { type: array, items: { type: object } }
                http_sources: { type: array, items: { type: object } }
                options: { $ref: "#/components/schemas/UpstreamOptions" }
                target:
                  type: object
                  properties:
                    kind: { type: string, enum: [inbody, zip] }
      responses:
        "200":
          description: The conversion (a failed document included).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConvertDocumentResponse" }
            application/zip:
              schema: { type: string, format: binary }
        "400":
          description: Malformed body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: A URL source without `--allow-url-fetch`, or an unsupported target kind.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/convert/file/async:
    post:
      summary: Queue an upload conversion — upstream docling-serve's API (#615)
      description: |
        The `/v1/convert/file` request, answered at once with a
        `TaskStatusResponse`; poll `GET /v1/status/poll/{id}`, then fetch the
        `ConvertDocumentResponse` from `GET /v1/result/{id}`.
      operationId: compatConvertFileAsync
      responses:
        "200":
          description: The queued task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskStatusResponse" }
        "429":
          description: The job queue is full.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/convert/source/async:
    post:
      summary: Queue a source conversion — upstream docling-serve's API (#615)
      operationId: compatConvertSourceAsync
      responses:
        "200":
          description: The queued task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskStatusResponse" }
        "429":
          description: The job queue is full.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/status/poll/{id}:
    get:
      summary: Task status in upstream's shape (#615)
      description: Any task's status (compat or `/v1/convert/async`). Also at `/v1alpha/status/poll/{id}`.
      operationId: compatStatusPoll
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The task's state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskStatusResponse" }
        "404":
          description: "Unknown or expired task — `{\"detail\": \"Task not found.\"}`."

  /v1/config:
    get:
      summary: Server capabilities
      operationId: getConfig
      responses:
        "200":
          description: What this server allows; the built-in playground adapts to it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  allow_url_fetch:
                    type: boolean
                    description: Whether URL inputs and `fetch_images` / `image_sources=remote` are enabled.
                  allow_local_images:
                    type: boolean
                    description: Whether `image_sources=local` is accepted (#646, `--allow-local-images`).
                  models:
                    type: array
                    description: >
                      Which model file each ML pipeline stage would load right
                      now (resolved live: CWD-relative with env overrides).
                      When two servers convert the same PDF differently, diff
                      this list first.
                    items:
                      type: object
                      properties:
                        stage: { type: string, examples: [layout, tableformer.decoder, ocr.rec, pdfium] }
                        path: { type: string }
                        found: { type: boolean }
                        bytes: { type: integer, description: File size (0 when missing) — tells an int8 quant from an fp32 graph at a glance. }
                      required: [stage, path, found, bytes]
                required: [allow_url_fetch, models]

  /health:
    get:
      summary: Liveness probe
      operationId: health
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }

  /ready:
    get:
      summary: Readiness probe
      operationId: ready
      description: >-
        With `--warmup`: 503 while the PDF/image models load, 200 once they are
        loaded (`models: warm`), and 503 `warmup_failed` with the error when
        they cannot load. Without it: 200 immediately (`models: lazy` — the
        first PDF/image request loads them).
      responses:
        "200":
          description: Ready to serve conversions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ready }
                  models: { type: string, enum: [warm, lazy] }
        "503":
          description: Models still loading, or failed to load.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [warming_up, warmup_failed] }
                  error: { type: string, description: "Why the warmup failed (`warmup_failed` only)." }

  /metrics:
    get:
      summary: Prometheus metrics
      operationId: metrics
      description: >
        Prometheus text exposition (version 0.0.4) of request counts by status
        class, an in-flight gauge, a request-latency histogram, and per-outcome
        conversion counts. Scrapes of `/metrics`, `/health` and `/ready` are
        excluded from the request metrics.
      responses:
        "200":
          description: Current metric values.
          content:
            text/plain:
              schema: { type: string }

  /openapi.yaml:
    get:
      summary: This document
      operationId: openapi
      responses:
        "200":
          description: The OpenAPI description of the running server.
          content:
            application/yaml:
              schema: { type: string }

components:
  schemas:
    To:
      type: string
      enum: [md, json, html, text, dclx, chunks, latex, pandoc, vtt, images]
      default: md
      description: |
        `md` — Markdown, streamed as it converts.
        `json` — docling `DoclingDocument` JSON.
        `html` — a complete HTML page (docling-core's HTML serializer, #492).
        `text` — plain text (docling's `--to text`, `export_to_text`, #613):
        the Markdown without `#`, emphasis, link URLs, code fences or image
        placeholders; lists and tables stay. `text/plain`; in a batch, inline
        under `text`.
        `pandoc` — Pandoc's AST as JSON (#515), `application/json`, for
        `pandoc -f json -t docx|odt|rst|typst|…`; pictures per `images`; in a
        batch, inline under `pandoc` as an object.
        `dclx` — DocLang OPC archive, returned as a download.
        `latex` — a complete LaTeX document (docling 2.124's `--to latex`,
        #317), `text/x-tex`; in a batch, inline under `latex`.
        `vtt` — WebVTT subtitles (docling's `--to vtt`, #614): a cue per
        timed text item — an audio/video transcript's segments, a WebVTT
        input's cues — or the bare `WEBVTT` header when there is none;
        `text/vtt`; in a batch, inline under `vtt`.
        `chunks` — chunker records (hierarchical, plus hybrid when a tokenizer is installed).
        `images` — PDF only: per-page PNG renders as
        `{"pages": [{"page", "width", "height", "png_base64"}]}` (no
        conversion, no models; capped at `DOCLING_RS_MAX_RASTER_PAGES`
        pages per request, default 100 — narrow with `pages=A-B`).
    Images:
      type: string
      enum: [placeholder, embedded]
      default: placeholder
      description: Markdown picture handling — `embedded` inlines base64 data URIs.
    OcrLang:
      type: string
      default: en
      examples: [en, ch, en-US, eng, zh, zh-Hans, zh-TW, "iso:zh-CN"]
      description: >
        OCR recognition language for scanned pages: `en` (default; the English
        PP-OCRv3 recognizer) or `ch` (the multilingual docling-conformance
        recognizer), or a BCP-47 tag for either language — `en-US`, `eng`,
        `zh`, `zh-Hans`, `zh-TW`; docling's `iso:` prefix is accepted and
        script/region subtags are ignored (#388). Any other language is a
        400 — only these two recognition models ship.
    OcrMode:
      type: string
      enum: [default, full_page, layout_regions, pdf_aware_layout_regions]
      default: default
      description: >-
        Which regions feed the OCR (docling's `OcrMode`) —
        `full_page`/`layout_regions` discard the embedded text layer like
        `force_full_page_ocr`; `pdf_aware_layout_regions` (= `default`) is the
        standard text-layer-aware behavior.
    OcrScale:
      type: number
      exclusiveMinimum: 0
      description: >-
        OCR render scale in pixels per PDF point (docling's
        `OcrOptions.scale`). Unset reads the pipeline's own 2.0 px/pt render;
        docling's default is 3 (216 dpi).
    OcrEngine:
      type: string
      enum: [ppocr, tesseract]
      description: >-
        Which OCR engine reads scanned pages (#460): the built-in PP-OCR
        recognizer (default) or the server's `tesseract` binary; under
        Tesseract `ocr_lang` is its language list (tessdata stems such as
        `deu+fra`, or BCP-47 tags).
    ImagesScale:
      type: number
      minimum: 0.1
      maximum: 4.0
      description: >-
        Picture crops (and page images) in pixels per PDF point — docling's
        `images_scale` (#520). Unset keeps the pipeline's 2.0 px/pt render;
        the JSON picture `dpi` is 72·scale.
    Scale:
      type: number
      minimum: 0.1
      maximum: 4.0
      default: 2.0
      description: >-
        `to=images` render scale in pixels per PDF point — 2.0 = 144 dpi,
        the ML pipeline's own render scale.
    Options:
      type: object
      description: Conversion options, shared by every transport.
      properties:
        to: { $ref: "#/components/schemas/To" }
        strict:
          type: boolean
          default: false
          description: Cleaner strict Markdown dialect instead of byte-for-byte docling-legacy output.
        images: { $ref: "#/components/schemas/Images" }
        no_ocr:
          type: boolean
          default: false
          description: >
            PDF/image — keep layout detection and TableFormer but never run OCR
            (docling's `do_ocr=False`, its `--no-ocr`; #244, and since 2.0 the
            meaning of `no_ocr`, #611): structure survives, text that exists
            only as pixels comes back empty.
        skip_ocr:
          type: boolean
          default: false
          deprecated: true
          description: "`no_ocr` under its pre-2.0 name, still read."
        text_layer_only:
          type: boolean
          default: false
          description: >
            PDF/image — skip layout/OCR/TableFormer; emit the embedded text
            layer only (what `no_ocr` meant before 2.0, #611). Wins over
            `no_ocr` when both are set.
        password:
          type: string
          format: password
          description: >-
            The password of an encrypted PDF (docling's `--pdf-password`, #611)
            or Office document — .docx/.xlsx/.pptx/.doc/.xls/.ppt (#625). A
            missing or wrong one is a 422 saying so.
        pdf_password:
          type: string
          format: password
          description: Alias of `password` (docling's PDF-only name).
        force_full_page_ocr:
          type: boolean
          default: false
          description: PDF — OCR every page even when it carries a text layer.
        no_table_former:
          type: boolean
          default: false
          description: PDF/image — geometric table reconstruction instead of the TableFormer model.
        no_text_panels:
          type: boolean
          default: false
          description: >
            PDF/image — keep every detected picture as a picture: disable the
            demotion of uncaptioned dense-text "picture" regions into
            paragraphs (the escape hatch for image-extraction workflows).
        heading_hierarchy:
          type: boolean
          default: false
          description: >
            PDF/image — infer section-header levels after assembly (docling's
            HeadingHierarchyModel): PDF bookmarks are authoritative, then
            legal/outline numbering, then font style. Off by default; headings
            then keep the flat level the pipeline emits.
        do_picture_classification:
          type: boolean
          default: false
          description: >
            PDF/image — classify every picture with DocumentFigureClassifier
            (docling's `do_picture_classification`, #423): the 26-class
            prediction lands on the JSON picture item as its `classification`
            annotation; Markdown is unchanged. Needs
            `.models/picture_classifier.onnx` on the server — a missing model
            warns and skips the pass.
        do_code_enrichment:
          type: boolean
          default: false
          description: >
            PDF/image — rewrite detected code blocks (and detect their
            language, JSON `code_language`) with the CodeFormulaV2 VLM
            (docling's `do_code_enrichment`, #423). Needs
            `.models/code_formula/`; slow on CPU — an autoregressive decode per
            code region.
        do_formula_enrichment:
          type: boolean
          default: false
          description: >
            PDF/image — decode display formulas to LaTeX with CodeFormulaV2
            (docling's `do_formula_enrichment`, #423): Markdown renders
            `$$latex$$` instead of the formula placeholder comment, the JSON
            formula item carries the LaTeX in `text`. Same model and cost as
            `do_code_enrichment`.
        do_picture_ocr:
          type: boolean
          default: false
          description: >
            Non-PDF documents — OCR the embedded pictures (DOCX/PPTX
            screenshots, HTML figures, sampled video frames) with the
            pipeline's OCR models and attach the text to the picture as
            docling's description annotation (#645): Markdown prints it
            between the caption and the image placeholder, the JSON picture
            item carries `meta.description` + the `description` annotation,
            chunks include it. Needs the OCR models on the server (the
            recognizer pair; `ocr_det.onnx` for line detection; Tesseract
            under `ocr_engine`); with `no_ocr` / `text_layer_only` or without
            them, one warning and no text. PDF/image pages are OCR'd by the
            pipeline itself and are left alone.
        picture_ocr_classes:
          type: string
          description: >
            With `do_picture_ocr`: only read the pictures the
            DocumentFigureClassifier labels as one of these comma-separated
            classes (`screenshot_from_computer,screenshot_from_manual`, …);
            unset = every picture. An unknown label is rejected (422). Needs
            `.models/picture_classifier.onnx`; a missing model waives the
            filter with a warning.
        picture_ocr_min_side:
          type: integer
          minimum: 0
          default: 32
          description: >
            With `do_picture_ocr`: skip pictures whose smaller side is under
            this many pixels — icons, bullets, rules. The server's
            `DOCLING_RS_PICTURE_OCR_MIN_SIDE` sets the default.
        keep_picture_images:
          type: boolean
          default: true
          description: >
            `false` drops the embedded image bytes from every picture after
            the enrichment pass (#645): a slim JSON/DCLX and placeholder-only
            Markdown, the OCR text and captions kept.
        redact_pii:
          type: boolean
          default: false
          description: >
            Redact personal data from the converted document before any
            export (#621, a docling.rs extension): e-mail, phone, card
            numbers (Luhn-checked), IBANs (mod-97), IP addresses, URL
            credentials, national IDs (US SSN, UK NINO, Aadhaar) and — with
            the NER model under `.models/ner/` on the server — names,
            organizations and locations. Every string of the document model
            is rewritten (the JSON's item tree, links, captions, hrefs, code,
            comments, table cells included), so Markdown, JSON, DCLX, text
            and chunks all come out clean. What was removed is reported as
            counts per label: `X-Docling-Redaction` on a single response,
            `redaction` on a batch / async item — never the values. Not a
            compliance guarantee.
        redact_mode:
          type: string
          enum: [label, pseudonym]
          default: label
          description: >
            `label` (`[EMAIL]`, `[PERSON]`), `pseudonym` (`[EMAIL_1]`,
            `[EMAIL_2]`: one number per distinct value, consistent within the
            document) or `fixed:<text>` (one string for everything).
        redact_kinds:
          type: string
          description: >
            Comma-separated kinds to redact — `email, phone, credit_card,
            iban, ip_address, url_credentials, national_id, person,
            organization, location, address`; unset = every kind. An unknown
            kind is rejected (422).
        redact_pattern:
          type: string
          description: >
            Extra patterns as `NAME=REGEX` entries, one per line; the match
            (or capture group 1) is redacted as `[NAME]`. An invalid
            expression is rejected (422).
        redact_images:
          type: string
          enum: [drop, box_out, keep]
          default: drop
          description: >
            Embedded images and page renders: `drop` removes them (nothing
            unread leaves the document); `box_out` OCRs each one and paints
            over the lines that carry a value (needs the OCR models; the
            streaming endpoint drops instead); `keep` leaves them.
        ebcdic_layout:
          type: string
          description: >
            EBCDIC (.ebc) — the copybook layout as inline `EbcdicLayout` JSON
            (docling's schema). Mandatory for the format: the record bytes are
            meaningless without their copybook.
        list_attachments:
          type: boolean
          default: false
          description: >
            Email (.eml/.msg) — append an Attachments section listing names and
            content types; the attachments' bytes are never embedded.
        fetch_images:
          type: boolean
          default: false
          description: >
            HTML/EPUB — resolve external `<img src>` and embed the bytes.
            Outbound fetch; honored only with `--allow-url-fetch`. The alias
            of `image_sources: remote` (#646).
        image_sources:
          allOf: [{ $ref: "#/components/schemas/ImageSources" }]
          description: >
            Which image references resolve (#646): `none` (default — every
            picture a placeholder), `embedded` (`data:` URIs and parts of the
            same container: EPUB/MHTML entries, email `cid:` attachments — no
            filesystem, no network), `local` (plus files next to a
            server-side source; needs `--allow-local-images`, 400 otherwise),
            `remote` (plus `http(s)` fetches; without `--allow-url-fetch` the
            request is held to `embedded`). HTML, EPUB, MHTML, JATS, AsciiDoc,
            ODF, Markdown and email bodies.
        image_hosts:
          oneOf:
            - { type: array, items: { type: string } }
            - { type: string }
          description: >
            Hosts a `remote` image fetch may reach (#646): exact names or
            `*.suffix` wildcards, as a list or a comma-separated string;
            unset = any host. Redirects are held to the same list; the
            private/loopback address block applies regardless.
        max_images:
          type: integer
          minimum: 0
          description: Images resolved per document; the rest stay placeholders (#646; default unlimited, `DOCLING_RS_MAX_IMAGES`).
        max_image_bytes:
          type: integer
          minimum: 1
          description: Largest image that resolves, in bytes (#646; default 32 MiB, `DOCLING_RS_MAX_IMAGE_BYTES`).
        max_image_total_mb:
          type: integer
          minimum: 0
          description: Total resolved image bytes per document, in MiB (#646; default unlimited, `DOCLING_RS_MAX_IMAGE_TOTAL_MB`).
        min_image_bytes:
          type: integer
          minimum: 0
          description: Smallest image that resolves, in bytes — skips spacer / tracking pixels (#646; default 0, `DOCLING_RS_MIN_IMAGE_BYTES`).
        skip_empty_cells:
          type: boolean
          default: false
          description: >
            XLSX/XLS — omit empty cells from sparse-sheet table grids instead
            of materialising each region's full bounding box (docling.rs
            extension; a table that loses cells drops its span overlay).
        compact_tables:
          type: boolean
          default: false
          description: >
            Render Markdown tables in the compact `| a | b |` form instead of
            the width-padded GitHub style (docling.rs extension, all formats).
        pandoc_api_version:
          type: string
          examples: ["1.23"]
          description: >
            `to=pandoc` (#515): the Pandoc API version the client's `pandoc`
            reads. Only 1.23 (pandoc-types 1.23.1.1, Pandoc 3.x) is written;
            any other version is a 400 rather than a document Pandoc would
            reject.
        page_break_placeholder:
          type: string
          examples: ["<!-- page break -->"]
          description: >
            Text inserted between pages in Markdown output (docling-core's
            `MarkdownParams.page_break_placeholder`; the shared option name,
            #577). A break lands only between two rendered blocks on
            different pages — never first or last, empty pages collapse.
            Unset: no page breaks (docling's default). Markdown only.
        md_page_break_placeholder:
          type: string
          description: Alias of `page_break_placeholder` (this server's historical spelling).
        pages:
          type: string
          pattern: '^\d+(-\d+)?$'
          description: PDF page window, `A-B` or a single `N` (1-based, inclusive).
          examples: ["2-5", "3"]
        ocr_lang: { $ref: "#/components/schemas/OcrLang" }
        ocr_mode: { $ref: "#/components/schemas/OcrMode" }
        ocr_scale: { $ref: "#/components/schemas/OcrScale" }
        ocr_engine: { $ref: "#/components/schemas/OcrEngine" }
        images_scale: { $ref: "#/components/schemas/ImagesScale" }
        page_images:
          type: boolean
          default: false
          description: >-
            Keep each page's render as the JSON `pages[n].image` (docling's
            `generate_page_images`, #520).
        document_timeout:
          type: number
          exclusiveMinimum: 0
          examples: [90]
          description: >-
            Per-document budget in seconds for the PDF pipeline (docling's
            `document_timeout`, #497), checked between pages: once spent, the
            pages done so far are the (partial) document and the response
            carries `x-docling-status: partial_success`. Unset = unlimited.
        use_web_browser:
          type: boolean
          default: false
          description: >-
            Pre-render HTML with a headless browser before parsing; needs a
            server built with the `web-browser` feature (a request on one
            without it fails with a clear error).
        scale: { $ref: "#/components/schemas/Scale" }
        asr_model:
          type: string
          description: Audio/video — Whisper preset directory under `.models/asr/`.
        asr_lang:
          type: string
          description: >-
            Audio/video — transcription language: a Whisper code (`en`, `de`,
            `zh`, …) or `auto` (default) to detect it from the first 30
            seconds. English-only presets always transcribe English.
        encoding:
          type: string
          description: >-
            Text inputs (Markdown, CSV, AsciiDoc, WebVTT, XML, …) — the
            character encoding to decode the file with, a WHATWG label such
            as `shift_jis`, `koi8-r` or `windows-1251` (docling's
            `TextBackendOptions.encoding`). Unset detects it: byte-order
            mark, then UTF-8, then windows-1252. Bytes the named encoding
            cannot decode fail the request instead of being guessed.
          examples: ["auto", "en", "de"]
        video_frames:
          oneOf:
            - { type: integer, minimum: 0 }
            - { type: string, enum: ["all"] }
          description: >
            Video — max frames sampled as pictures (0 = transcript only;
            needs ffmpeg on the server). `all` (or any count at or above
            4294967295) keeps every distinct cut (#647).
        video_scene_threshold:
          type: number
          minimum: 0
          maximum: 1
          description: >
            Video — ffmpeg's scene score a frame must exceed to count as a
            cut (#647). Default 0.27; 0.6 keeps hard cuts only.
        video_frame_max_side:
          type: integer
          minimum: 0
          description: >
            Video — downscale each sampled frame inside ffmpeg so its longer
            side is at most this many px (#647); 0 = the source resolution.
        video_frame_dedupe:
          type: integer
          minimum: 0
          maximum: 64
          description: >
            Video — drop a sampled frame whose 64-bit difference hash is
            within this Hamming distance of a frame already kept (#647): the
            same slide after a fade becomes one picture. Unset = keep every
            frame; 4–6 is a good distance.
        xbrl_taxonomy:
          type: string
          description: >
            XBRL — server-local directory holding the instance's taxonomy (its
            extension schema and linkbases at the paths the instance's schemaRef
            names, plus taxonomy packages mapping the base taxonomies' URLs),
            docling's XBRLBackendOptions.taxonomy. A relative path without
            '..' components. Without it the fact graph carries no
            presentation/calculation hierarchy (#466).
        chunker: { $ref: "#/components/schemas/Chunker" }
        chunk_tokenizer:
          type: string
          description: >
            `to=chunks` — hybrid tokenizer: a server-local *relative* path to a
            HuggingFace `tokenizer.json` (absolute paths and `..` are
            rejected). Default: the server's `DOCLING_CHUNK_TOKENIZER`, else
            `.models/chunk/tokenizer.json`.
        chunk_max_tokens:
          type: integer
          minimum: 1
          default: 256
          description: >
            `to=chunks` — hybrid chunk budget in tokens (docling's
            `max_tokens`; server default overridable via
            `DOCLING_CHUNK_MAX_TOKENS`).
        chunk_merge_peers:
          type: boolean
          default: true
          description: >
            `to=chunks` — merge undersized successive hybrid chunks with the
            same headings (docling's `merge_peers`).
        pipeline: { $ref: "#/components/schemas/Pipeline" }
        vlm_endpoint:
          type: string
          format: uri
          description: >
            `pipeline=vlm` — the OpenAI-compatible endpoint (base `/v1` URL or
            full `…/chat/completions`). Request-supplied values need
            `--allow-url-fetch`; unset falls back to the server's
            `DOCLING_RS_VLM_ENDPOINT`.
        vlm_model:
          type: string
          description: >-
            `pipeline=vlm` — model name as the endpoint knows it; falls back
            to `DOCLING_RS_VLM_MODEL`.
        vlm_api_key:
          type: string
          description: >-
            `pipeline=vlm` — Bearer token; falls back to
            `DOCLING_RS_VLM_API_KEY`.
        vlm_prompt:
          type: string
          description: >-
            `pipeline=vlm` — per-page instruction; falls back to
            `DOCLING_RS_VLM_PROMPT`, else docling's DocLang-eliciting prompt.
        vlm_max_tokens:
          type: integer
          minimum: 1
          default: 8192
          description: "`pipeline=vlm` — max_tokens per completion."
    DoclingDocument:
      type: object
      description: >
        docling-core's native document JSON (schema 1.10.0): a `body` tree of
        `$ref`s into `texts` / `groups` / `tables` / `pictures`. Loads back into
        Python docling-core via `DoclingDocument.load_from_json`.
      properties:
        schema_name: { type: string }
        version: { type: string }
        name: { type: string }
        body: { type: object }
        texts: { type: array, items: { type: object } }
        groups: { type: array, items: { type: object } }
        tables: { type: array, items: { type: object } }
        pictures: { type: array, items: { type: object } }
    SourceSpec:
      type: object
      required: [kind]
      description: >
        docling `kind`-tagged source (#139). `file`: {base64_string, filename}.
        `http`: {url, headers?}. `s3`: {endpoint, access_key, secret_key,
        bucket, key_prefix?, verify_ssl?, max_num_elements?}. `azure_blob`:
        {account_name, container, connection_string, blob_prefix?,
        max_num_elements?}. `google_cloud_storage`: {bucket, key_prefix?,
        project?, service_account_key?, max_num_elements?}. Field names mirror
        docling's service-datamodel models; credentials ride in the request
        (trusted-client + TLS assumption, as upstream).
      properties:
        kind:
          type: string
          enum: [file, http, s3, azure_blob, google_cloud_storage]
      additionalProperties: true
    TargetSpec:
      type: object
      required: [kind]
      description: >
        docling `kind`-tagged output target (#139, #303): `inbody` (default —
        the response body); a cloud store with the same coordinate fields as
        the matching source kind (each converted document uploads as
        `<stem>.<ext>` under the prefix, response is a `RemoteTargetResult`
        acknowledgment with per-item outcomes); `zip` (one `application/zip`
        archive of the `<stem>.<ext>` rendered outputs in the response body —
        no gate, nothing outbound; a failed batch item becomes a
        `<stem>.<ext>.error.txt` entry); or `put`: {url} (HTTP PUT each
        rendered output to that — typically pre-signed — URL; needs
        `--allow-url-fetch`, same SSRF check as URL inputs, answers with the
        `RemoteTargetResult` acknowledgment, query string redacted).
      properties:
        kind:
          type: string
          enum: [inbody, s3, azure_blob, google_cloud_storage, zip, put]
      additionalProperties: true
    Pipeline:
      type: string
      enum: [standard, vlm]
      default: standard
      description: >
        Conversion pipeline (#304). `vlm` sends every PDF page / image to a
        remote OpenAI-compatible vision model instead of the local ML stack;
        the `vlm_*` options apply (and fall back to the server's
        `DOCLING_RS_VLM_*` environment — the operator-pinned mode). A
        request-supplied `vlm_endpoint` needs `--allow-url-fetch` (SSRF
        surface) and must not resolve to a private address. With `standard`
        the `vlm_*` options are ignored.
    ImageSources:
      type: string
      enum: [none, embedded, local, remote]
      default: none
      description: The image-source tier (#646); see `image_sources`.
    Chunker:
      type: string
      enum: [hierarchical, hybrid]
      description: >
        `to=chunks` — return only this chunker's records (docling's
        `ChunkerType`, #256). Unset returns both: `hierarchical` always,
        `hybrid` when a tokenizer is available. An explicit `hybrid` without a
        usable tokenizer is a 400.
    PandocAst:
      type: object
      description: >
        Pandoc's AST (`to=pandoc`, #515) — the JSON `pandoc -f json` reads
        (`Text.Pandoc.Definition`, pandoc-types 1.23.1.1).
      required: [pandoc-api-version, meta, blocks]
      properties:
        pandoc-api-version:
          type: array
          items: { type: integer }
          examples: [[1, 23, 1, 1]]
        meta: { type: object }
        blocks: { type: array, items: { type: object } }
    Chunks:
      type: object
      description: Chunker output for `to=chunks`.
      properties:
        chunks:
          type: array
          items:
            type: object
            properties:
              text: { type: string }
              headings: { type: array, items: { type: string } }
    TaskStatus:
      type: object
      description: An async conversion job's state.
      properties:
        task_id: { type: string }
        task_status:
          type: string
          enum: [pending, started, success, failure]
        error:
          type: string
          description: Present when `task_status` is `failure`.
        code:
          type: string
          description: With `error`, when the failure has a machine-readable case — see `Error.code`.
      required: [task_id, task_status]
    ConfidenceReport:
      type: object
      description: >
        Conversion-confidence scores (docling `ConfidenceReport` semantics):
        each score is 0–1 or null when its stage didn't run; grades bucket the
        aggregate (`poor` < 0.5 ≤ `fair` < 0.8 ≤ `good` < 0.9 ≤ `excellent`,
        `unspecified` when nothing scored). `pages` is keyed by the real
        1-based page number and carries the same fields per page.
      properties:
        layout_score: { type: [number, "null"], description: Mean confidence of the kept layout regions. }
        ocr_score: { type: [number, "null"], description: Mean recognition confidence of OCR'd cells. }
        parse_score: { type: [number, "null"], description: 10th-percentile text-layer extraction quality. }
        table_score: { type: [number, "null"], description: Reserved (never set — matches Python docling). }
        mean_score: { type: [number, "null"] }
        low_score: { type: [number, "null"] }
        mean_grade: { type: string, enum: [poor, fair, good, excellent, unspecified] }
        low_grade: { type: string, enum: [poor, fair, good, excellent, unspecified] }
        pages: { type: object, additionalProperties: { type: object } }
    Error:
      type: object
      properties:
        error: { type: string }
        code:
          type: string
          enum: [password_required, wrong_password, not_decryptable, malformed_encryption]
          description: >
            Set when the document is encrypted (#636): `password_required` (none
            was given), `wrong_password` (the request's `password` does not open
            it) — the two a client prompts for a password on — `not_decryptable`
            (a scheme the server does not read: ODF, iWork, WordPerfect, XOR
            obfuscation) or `malformed_encryption` (a damaged encryption header).
            Absent for every other error.
      required: [error]

    ConvertDocumentResponse:
      type: object
      description: Upstream docling-serve's answer for one document (#615).
      properties:
        document:
          type: object
          properties:
            filename: { type: string }
            md_content: { type: [string, "null"] }
            json_content: { type: [object, "null"], description: docling `DoclingDocument` JSON }
            html_content: { type: [string, "null"] }
            text_content: { type: [string, "null"] }
            doctags_content: { type: "null", description: always null — no DocTags writer }
            doclang_content: { type: [string, "null"] }
        status: { type: string, enum: [success, partial_success, failure] }
        errors:
          type: array
          items:
            type: object
            properties:
              component_type: { type: string }
              module_name: { type: string }
              error_message: { type: string }
        processing_time: { type: number }
        timings: { type: object }
        confidence: { type: object, description: PDF/image conversions only }
    TaskStatusResponse:
      type: object
      properties:
        task_id: { type: string }
        task_type: { type: string, enum: [convert] }
        task_status: { type: string, enum: [pending, started, success, failure] }
        task_position: { type: ["null", integer] }
        task_meta: { type: ["null", object] }
        error_message: { type: string }
    UpstreamOptions:
      type: object
      description: |
        Python docling-serve's option names (#615). Read: `to_formats`
        (md, json, html, text, doclang; doctags is always null),
        `image_export_mode` (embedded default | placeholder; referenced is
        answered as placeholder), `md_page_break_placeholder`, `do_ocr`,
        `force_ocr`, `do_table_structure`, `page_range`,
        `do_pdf_heading_hierarchy`, `md_compact_tables`,
        `do_code_enrichment`, `do_formula_enrichment`,
        `do_picture_classification`, `document_timeout`, `images_scale`,
        `pipeline` (vlm; others select by input format), `ocr_engine`
        (tesseract / tesserocr / tesseract_cli → Tesseract, the rest → the
        built-in PP-OCR), `ocr_lang`, `target_type` (zip). This server's own
        option names (`strict`, `password`, …) are read too; everything
        else is ignored.
      properties:
        to_formats: { type: array, items: { type: string } }
        image_export_mode: { type: string, enum: [embedded, placeholder, referenced] }
        md_page_break_placeholder: { type: string }
        do_ocr: { type: boolean }
        force_ocr: { type: boolean }
        do_table_structure: { type: boolean }
        page_range: { type: array, items: { type: integer }, minItems: 2, maxItems: 2 }
        ocr_engine: { type: string }
        ocr_lang: { type: array, items: { type: string } }
        target_type: { type: string, enum: [inbody, zip] }

