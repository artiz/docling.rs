<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <title>Deployment Flow</title>
  <desc>Build, test and release pipeline of the docling.rs project.</desc>
  <defs>
    <clipPath id="clip"><text x="0" y="0">CLIPPED NEVER SHOWN</text></clipPath>
  </defs>
  <style>.box { fill: #eef; stroke: #336; }</style>
  <g font-size="14" transform="translate(20 30)">
    <rect class="box" x="0" y="0" width="160" height="48"/>
    <text x="80" y="28" text-anchor="middle">Checkout sources</text>
    <rect class="box" x="220" y="0" width="160" height="48"/>
    <text x="300" y="28" text-anchor="middle">Cargo build</text>
    <rect class="box" x="440" y="0" width="160" height="48"/>
    <text x="520" y="28" text-anchor="middle">Test suite</text>
    <text x="80" y="150" font-size="12">
      <tspan x="80" dy="0">Release notes are</tspan>
      <tspan x="80" dy="1.2em">assembled automatically</tspan>
    </text>
    <text x="300" y="150" display="none">hidden draft</text>
  </g>
  <text x="320" y="340" font-size="10" visibility="hidden">watermark</text>
</svg>
