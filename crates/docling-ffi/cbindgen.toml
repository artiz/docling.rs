# cbindgen configuration for the committed C header (issue #193).
#
# Regenerate after changing the extern "C" surface:
#
#     cbindgen --config crates/docling-ffi/cbindgen.toml \
#              --crate docling-ffi \
#              --output crates/docling-ffi/include/docling.h
language = "C"
cpp_compat = true
include_guard = "DOCLING_H"
documentation = true
documentation_style = "c99"
header = """/* docling.rs — minimal C ABI for embedders (issue #193).
 *
 * Generated by cbindgen from crates/docling-ffi; do not edit by hand.
 * See crates/docling-ffi/README.md for usage and the options JSON keys. */"""

[export]
# The result handle stays opaque: only ever a pointer on the C side.
include = ["DoclingResult"]

[parse]
parse_deps = false
