# PyPI distribution `llama-index-readers-docling-rs`: the LlamaIndex reader
# under the `llama_index.readers.<name>` namespace every reader package uses
# (run-llama/llama_index no longer takes new integration packages into its
# monorepo — they are published independently, as this one is). It has no
# code of its own: the reader is `docling_rs.llamaindex.DoclingReader`,
# shipped in the docling-rs wheel; this package pins that wheel (with its
# `llamaindex` extra) and re-exports it. pypi-publish.yml writes the release
# version into `version` and into the docling-rs pin before building; the
# committed values are placeholders (install locally with `pip install --no-deps`).
[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "llama-index-readers-docling-rs"
version = "0.0.0"
description = "LlamaIndex reader for docling.rs: PDF with layout, tables and OCR, DOCX, PPTX, XLSX, HTML and 40-odd formats into LlamaIndex Documents as Markdown or docling JSON. docling in Rust, no PyTorch."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "docling.rs contributors" }]
keywords = ["llama-index", "llamaindex", "reader", "docling", "pdf", "docx", "rag", "ocr", "document-conversion"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "llama-index-core>=0.12,<0.15",
    "docling-rs[llamaindex]==0.0.0",
]

[project.urls]
Homepage = "https://github.com/docling-project/docling.rs"
Repository = "https://github.com/docling-project/docling.rs"
Documentation = "https://github.com/docling-project/docling.rs/blob/master/crates/docling-py/README.md#llamaindex"
Issues = "https://github.com/docling-project/docling.rs/issues"

[tool.hatch.build.targets.wheel]
packages = ["llama_index/"]

[tool.llamahub]
contains_example = false
import_path = "llama_index.readers.docling_rs"

[tool.llamahub.class_authors]
DoclingRsReader = "artiz"
