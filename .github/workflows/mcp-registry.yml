# Publish the docling.rs MCP server (#669) to the MCP catalogs.
# pypi-publish.yml calls it after it publishes a release tag's launcher (PyPI
# publishing is manual, so a GitHub Release alone does not); run it by hand
# to repair a failed publish.
#
# `publish`: the official MCP registry (registry.modelcontextprotocol.io —
# the catalog MCP clients and downstream registries read) gets
# server.json, with the version written in, as
# `io.github.docling-project/docling-rs`. The registry verifies every
# package server.json lists before accepting the entry: the PyPI launcher
# `docling-rs-mcp` (its README carries the `mcp-name:` marker) and the CLI
# image `ghcr.io/docling-project/docling-rs:<version>` (its
# `io.modelcontextprotocol.server.name` label). pypi-publish.yml and
# docker-publish.yml publish those, so this job waits until both exist.
# Authentication is GitHub OIDC — the workflow's identity proves the
# `io.github.docling-project` namespace; no secret.
#
# `bundle`: Smithery lists a local server only as an MCP bundle (.mcpb) — a
# zip of crates/docling-py/mcp/mcpb/ whose manifest runs
# `uvx docling-rs-mcp@<version>`. Once the launcher is on PyPI the job packs
# it with the version, publishes it to Smithery when the repository has the
# `SMITHERY_API_KEY` secret and the `SMITHERY_SERVER` variable
# (`<namespace>/<server id>`) — optional: a Smithery failure only warns — and
# attaches it to the release.
#
# Manual fallback and the other catalogs: docs/MCP_REGISTRIES.md.
name: mcp registry

on:
  workflow_call:
    inputs:
      version:
        description: "Version to publish (e.g. 2.19.1); its release tag is checked out."
        required: true
        type: string
    secrets:
      SMITHERY_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 2.19.1); its release tag is checked out. Blank = the workspace version of the dispatched ref."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  publish:
    name: publish server.json
    # Only the canonical repository owns the io.github.docling-project
    # namespace.
    if: github.repository == 'docling-project/docling.rs'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.ref }}

      - name: Resolve version
        id: v
        shell: bash
        run: |
          v="${{ inputs.version }}"
          if [ -z "$v" ]; then v="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Publishing server version $v"

      # PyPI wheels and the multi-arch images take a while: poll every 2 min
      # for up to 4 h rather than fail on a race.
      - name: Wait for the PyPI launcher and the CLI image
        shell: bash
        run: |
          v="${{ steps.v.outputs.version }}"
          accept="application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json"
          for _ in $(seq 1 120); do
            pypi=$(curl -sS -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/docling-rs-mcp/$v/json" || true)
            token=$(curl -sS "https://ghcr.io/token?scope=repository:docling-project/docling-rs:pull" | jq -r .token || true)
            image=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" -H "Accept: $accept" \
              "https://ghcr.io/v2/docling-project/docling-rs/manifests/$v" || true)
            echo "pypi docling-rs-mcp==$v: $pypi · ghcr docling-rs:$v: $image"
            if [ "$pypi" = 200 ] && [ "$image" = 200 ]; then exit 0; fi
            sleep 120
          done
          echo "::error::docling-rs-mcp==$v on PyPI or ghcr.io/docling-project/docling-rs:$v never appeared"
          exit 1

      - name: Write the version into server.json
        shell: bash
        run: |
          v="${{ steps.v.outputs.version }}"
          jq --arg v "$v" '
            .version = $v
            | .packages |= map(
                if .registryType == "oci" then .identifier |= sub(":[^:/]*$"; ":" + $v)
                else .version = $v end)' server.json > server.tmp
          mv server.tmp server.json
          cat server.json

      - name: Install mcp-publisher
        shell: bash
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      # A re-run of the release workflow for a tag already in the registry
      # (re-publishing a sibling package, say) must not fail here: the
      # registry refuses a duplicate version, and that is the state we want.
      - name: Publish
        shell: bash
        run: |
          set +e
          out=$(./mcp-publisher publish 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ "$code" -ne 0 ] && grep -q "duplicate version" <<<"$out"; then
            echo "::notice::this version is already in the MCP registry; nothing to publish"
            exit 0
          fi
          exit "$code"

  bundle:
    name: MCP bundle (.mcpb) → Smithery + release
    if: github.repository == 'docling-project/docling.rs'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write # attach the bundle to the release
    env:
      SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.ref }}

      - name: Resolve version
        id: v
        shell: bash
        run: |
          v="${{ inputs.version }}"
          if [ -z "$v" ]; then v="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Bundling server version $v"

      # The bundle runs `uvx docling-rs-mcp@<version>`, which pins
      # `docling-rs==<version>`: publish it only once uv itself resolves
      # that pair. PyPI's JSON API answers for a package the moment it is
      # uploaded, but the simple index uv installs from lags behind it by
      # minutes (a CDN-cached page) — and the launcher is uploaded after
      # the wheels, so its JSON turning 200 says nothing about docling-rs's
      # index page. A dry-run resolution, cache bypassed, is the real test.
      - name: Wait until uv resolves the PyPI launcher
        shell: bash
        run: |
          v="${{ steps.v.outputs.version }}"
          pipx install uv
          uv venv --quiet .probe
          for _ in $(seq 1 120); do
            launcher=$(curl -sS -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/docling-rs-mcp/$v/json" || true)
            wheel=$(curl -sS -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/docling-rs/$v/json" || true)
            echo "pypi docling-rs-mcp==$v: $launcher · docling-rs==$v: $wheel"
            if [ "$launcher" = 200 ] && [ "$wheel" = 200 ] &&
               uv pip install --python .probe --dry-run --no-cache "docling-rs-mcp==$v"; then
              echo "docling-rs-mcp==$v resolves"
              exit 0
            fi
            sleep 120
          done
          echo "::error::docling-rs-mcp==$v (with docling-rs==$v) never became resolvable on PyPI"
          exit 1

      # `mcpb pack` validates the manifest against the MCPB schema.
      - name: Pack the bundle
        shell: bash
        run: |
          v="${{ steps.v.outputs.version }}"
          m=crates/docling-py/mcp/mcpb/manifest.json
          jq --arg v "$v" '
            .version = $v
            | .server.mcp_config.args |= map(
                if startswith("docling-rs-mcp@") then "docling-rs-mcp@" + $v else . end)' "$m" > manifest.tmp
          mv manifest.tmp "$m"
          cat "$m"
          npx -y @anthropic-ai/mcpb@2.1.2 pack crates/docling-py/mcp/mcpb "docling-rs-mcp-$v.mcpb"

      - uses: actions/upload-artifact@v7
        with:
          name: mcp-bundle
          path: docling-rs-mcp-*.mcpb
          if-no-files-found: error

      # Smithery's API wants an `inputSchema` on every tool of the card it
      # builds from manifest.tools, which the MCPB schema `mcpb pack` checks
      # does not allow: its copy of the bundle takes the tool definitions
      # from the published server's own tools/list (scripts/ci/mcpb_smithery.py
      # runs the bundle's `uvx` command, hence uv). The release keeps the
      # bundle as packed.
      - name: Add the tool schemas for Smithery
        id: smithery_card
        if: ${{ env.SMITHERY_API_KEY != '' && vars.SMITHERY_SERVER != '' }}
        continue-on-error: true
        shell: bash
        env:
          # The bundle's `uvx` resolves against PyPI afresh, like the probe
          # above did — not against an index page uv cached before the
          # version was there.
          UV_NO_CACHE: "1"
        run: |
          v="${{ steps.v.outputs.version }}"
          python3 scripts/ci/mcpb_smithery.py "docling-rs-mcp-$v.mcpb" "smithery-$v.mcpb"

      # Non-interactive: the key comes from the environment, and a server id
      # Smithery does not know yet is created. Optional, like the step above:
      # Smithery's registry has stopped taking updates of an existing server
      # (403 "Updating servers has been removed", 2.37.1), so a failure here
      # is a warning and the bundle still goes to the release.
      - name: Publish to Smithery
        id: smithery
        if: ${{ steps.smithery_card.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          v="${{ steps.v.outputs.version }}"
          npx -y @smithery/cli@4.11.1 mcp publish "smithery-$v.mcpb" -n "${{ vars.SMITHERY_SERVER }}"

      - name: Report a skipped Smithery publish
        if: ${{ steps.smithery_card.outcome == 'failure' || steps.smithery.outcome == 'failure' }}
        shell: bash
        run: |
          echo "::warning title=Smithery::the bundle was not published to Smithery (see the step above); the release still gets it — publish it by hand per docs/MCP_REGISTRIES.md if Smithery takes it again"

      - name: Attach the bundle to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.v.outputs.version }}"
          gh release upload "v$v" "docling-rs-mcp-$v.mcpb" --clobber --repo "$GITHUB_REPOSITORY"
