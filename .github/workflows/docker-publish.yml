# Build and publish `docling-rs-serve` and `docling-rs` container images to
# GitHub Container Registry (ghcr.io).
#
# The images package the pure-Rust `docling-serve` HTTP conversion API and the
# `docling-rs` CLI along with their native runtime dependencies (ffmpeg,
# pdfium, and the ONNX models for layout detection, TableFormer table
# structure, and PP-OCRv3 recognition) into slim, Python-free container images.
#
# Published image families:
#   CPU (multi-arch: linux/amd64 + linux/arm64):
#     - ghcr.io/docling-project/docling-rs-serve      — HTTP conversion API
#     - ghcr.io/docling-project/docling-rs            — docling-rs CLI
#   CUDA GPU (linux/amd64, CUDA 13 + cuDNN 9, --features cuda):
#     - ghcr.io/docling-project/docling-rs-serve-cuda — CUDA HTTP conversion API
#     - ghcr.io/docling-project/docling-rs-cuda       — CUDA docling-rs CLI
#
# Multi-arch CPU builds run natively on matrix runners — `ubuntu-latest` for
# linux/amd64 and `ubuntu-24.04-arm` for linux/arm64 — avoiding slow QEMU
# emulation. Single-arch CPU images are pushed by digest and assembled into
# multi-arch manifest lists by the `merge-cpu` job.
#
# CUDA images are built on `ubuntu-latest` (linux/amd64) and tagged like the
# CPU ones: semantic versions plus a floating `:latest`. (Upstream
# docling-serve gives its CUDA flavours no `:latest`; one convention across
# all four images was preferred here — a CUDA-base bump is called out in the
# release notes, and the version tags stay for anyone pinning.)
#
# Triggers:
#   - Release published: tags with semantic versions (vX.Y.Z, X.Y, X) and latest, CPU and CUDA alike
#   - Manual dispatch: tag override or dry-run testing (with optional CUDA
#     toggle); dispatched from a branch it also tags the branch name.
#   - Pushes to master do NOT run this workflow (nor do pull requests): every
#     merge that changes a publishable crate is released by ci.yml minutes
#     later, and that release publishes the same images — the former
#     push-triggered run built each merge twice (a `master` tag first, the
#     version tags right after) for no image the release run did not also
#     produce. The smoke tests below still gate every publish (a failing smoke
#     test fails the run before any push).

name: docker-publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Explicit image tag to publish (e.g. v1.28.0 or latest). Blank = derive from ref/release."
        required: false
        default: ""
      publish:
        description: "Publish images to GHCR (false = build & test only, no push)."
        required: false
        type: boolean
        default: true
      cuda:
        description: "Also build and publish CUDA GPU images (docling-rs-serve-cuda / docling-rs-cuda)."
        required: false
        type: boolean
        default: true
# Least privilege at the workflow level: read checkout only.
# Write permissions are granted explicitly at the job level.
permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.workflow }}-${{ github.ref }}
  # Publishing runs are never cancelled mid-flight; a second release or
  # dispatch on the same ref simply queues behind the running one.
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  SERVE_IMAGE: ${{ github.repository_owner }}/docling-rs-serve
  CLI_IMAGE: ${{ github.repository_owner }}/docling-rs
  SERVE_CUDA_IMAGE: ${{ github.repository_owner }}/docling-rs-serve-cuda
  CLI_CUDA_IMAGE: ${{ github.repository_owner }}/docling-rs-cuda

jobs:
  # ============================================================================
  # 1. CPU Build Matrix (linux/amd64 on ubuntu-latest, linux/arm64 on ubuntu-24.04-arm)
  # ============================================================================
  build-cpu:
    name: build CPU (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            platform_slug: linux-amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            platform_slug: linux-arm64
            runner: ubuntu-24.04-arm
          # IBM Z (#504): no native runner — the binaries cross-compile in a
          # build-platform stage, the Debian runtime/assets stages run under
          # QEMU, and the images carry the s390x ONNX Runtime from the models
          # release (see the Dockerfile). `target_suffix` picks the s390x
          # final stages; the ML smoke tests are skipped (model inference
          # under QEMU is far too slow), the Markdown one runs.
          - platform: linux/s390x
            platform_slug: linux-s390x
            runner: ubuntu-latest
            target_suffix: -s390x
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          docker system prune -af || true
          df -h

      - name: Set up QEMU (foreign-arch stages and smoke tests)
        if: matrix.platform == 'linux/s390x'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: s390x

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata labels for CPU serve image
        id: meta_serve
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.SERVE_IMAGE }}
          labels: |
            org.opencontainers.image.title=docling-rs-serve
            org.opencontainers.image.description=High-performance document conversion API in Rust (PDF, DOCX, PPTX, XLSX, HTML, Audio)
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.vendor=docling-project

      - name: Extract metadata labels for CPU CLI image
        id: meta_cli
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.CLI_IMAGE }}
          labels: |
            org.opencontainers.image.title=docling-rs
            org.opencontainers.image.description=docling-rs CLI — document conversion (PDF, DOCX, PPTX, XLSX, HTML, Audio) to Markdown / JSON / DCLX / LaTeX
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.vendor=docling-project

      - name: Build local CPU serve image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/docling-serve/Dockerfile
          target: serve${{ matrix.target_suffix }}
          load: true
          tags: docling-rs-serve:test
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta_serve.outputs.labels }}
          cache-from: type=gha,scope=docling-rs-serve-${{ matrix.platform_slug }}
          cache-to: type=gha,mode=max,scope=docling-rs-serve-${{ matrix.platform_slug }}

      - name: Build local CPU CLI image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/docling-serve/Dockerfile
          target: cli${{ matrix.target_suffix }}
          load: true
          tags: docling-rs:test
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta_cli.outputs.labels }}
          cache-from: type=gha,scope=docling-rs-serve-${{ matrix.platform_slug }}
          cache-to: type=gha,mode=max,scope=docling-rs-serve-${{ matrix.platform_slug }}

      - name: Run CLI smoke test
        run: |
          echo "Converting a Markdown fixture (no models involved)..."
          docker run --rm -v "$PWD/tests/data/md/sources:/data:ro" docling-rs:test wiki.md --to md | head -n 3
          if [ "${{ matrix.platform }}" = "linux/s390x" ]; then
            echo "s390x under QEMU: the ONNX Runtime must be in the image, the PDF run is skipped (emulated inference)"
            docker run --rm --entrypoint ls docling-rs:test -la /app/.models/onnxruntime/ | grep -q libonnxruntime.so
            exit 0
          fi
          echo "Converting a small PDF (models must resolve via DOCLING_RS_MODELS_DIR)..."
          out=$(docker run --rm -v "$PWD/tests/data/pdf/sources:/data:ro" docling-rs:test base14_fonts.pdf --to latex)
          echo "$out" | head -n 20
          echo "$out" | grep -q '\\begin{document}' || { echo "CLI smoke test failed: no LaTeX document produced"; exit 1; }

      - name: Run container smoke test
        # The s390x serve image warms the models under QEMU — minutes per
        # session, past any sensible readiness window.
        if: matrix.platform != 'linux/s390x'
        run: |
          echo "Starting docling-rs-serve container on ${{ matrix.platform }}..."
          docker run -d --name docling-rs-serve-test -p 5001:5001 docling-rs-serve:test

          echo "Waiting for service readiness (/ready)..."
          READY=false
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5001/ready | grep -q '"status":"ready"'; then
              echo "Readiness probe OK (models warm)"
              READY=true
              break
            fi
            echo "Waiting for container readiness ($i/60)..."
            sleep 5
          done

          if [ "$READY" != "true" ]; then
            echo "Smoke test readiness check failed! Container logs:"
            docker logs docling-rs-serve-test
            docker rm -f docling-rs-serve-test
            exit 1
          fi

          echo "Verifying /v1/config endpoint..."
          CONFIG=$(curl -sf http://localhost:5001/v1/config)
          echo "Config: $CONFIG"

          echo "Cleaning up smoke test container..."
          docker rm -f docling-rs-serve-test

      - name: Build and push CPU serve image by digest
        id: build_serve
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/docling-serve/Dockerfile
          target: serve${{ matrix.target_suffix }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta_serve.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.SERVE_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=docling-rs-serve-${{ matrix.platform_slug }}
          cache-to: type=gha,mode=max,scope=docling-rs-serve-${{ matrix.platform_slug }}

      - name: Build and push CPU CLI image by digest
        id: build_cli
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/docling-serve/Dockerfile
          target: cli${{ matrix.target_suffix }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta_cli.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.CLI_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=docling-rs-serve-${{ matrix.platform_slug }}
          cache-to: type=gha,mode=max,scope=docling-rs-serve-${{ matrix.platform_slug }}

      - name: Export CPU digests
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        run: |
          mkdir -p /tmp/digests/serve /tmp/digests/cli
          digest="${{ steps.build_serve.outputs.digest }}"
          touch "/tmp/digests/serve/${digest#sha256:}"
          digest="${{ steps.build_cli.outputs.digest }}"
          touch "/tmp/digests/cli/${digest#sha256:}"

      - name: Upload CPU serve digest
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        uses: actions/upload-artifact@v7
        with:
          name: digests-serve-${{ matrix.platform_slug }}
          path: /tmp/digests/serve/*
          if-no-files-found: error
          retention-days: 1

      - name: Upload CPU CLI digest
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        uses: actions/upload-artifact@v7
        with:
          name: digests-cli-${{ matrix.platform_slug }}
          path: /tmp/digests/cli/*
          if-no-files-found: error
          retention-days: 1

  # ============================================================================
  # 2. Merge CPU Multi-Arch Manifest Lists & Publish
  # ============================================================================
  merge-cpu:
    name: merge CPU multi-arch manifests & publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-cpu
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Download serve digests
        uses: actions/download-artifact@v8
        with:
          pattern: digests-serve-*
          path: /tmp/digests/serve
          merge-multiple: true

      - name: Download CLI digests
        uses: actions/download-artifact@v8
        with:
          pattern: digests-cli-*
          path: /tmp/digests/cli
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.SERVE_IMAGE }}
            ${{ env.REGISTRY }}/${{ env.CLI_IMAGE }}
          flavor: |
            latest=auto
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || github.event_name == 'release' }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
          labels: |
            org.opencontainers.image.title=docling-rs-serve
            org.opencontainers.image.description=High-performance document conversion API in Rust (PDF, DOCX, PPTX, XLSX, HTML, Audio)
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.vendor=docling-project

      - name: Create manifest list and push for the serve image
        id: merge-serve
        env:
          ALL_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          first_tag=""
          tags=()
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            if [[ "$tag" == "${REGISTRY}/${SERVE_IMAGE}:"* ]]; then
              tags+=("-t" "$tag")
              if [ -z "$first_tag" ]; then
                first_tag="$tag"
              fi
            fi
          done <<< "$ALL_TAGS"

          sources=()
          for digest in /tmp/digests/serve/*; do
            [ -f "$digest" ] || continue
            sources+=("${REGISTRY}/${SERVE_IMAGE}@sha256:$(basename "$digest")")
          done

          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          # Read the manifest-list digest back from the registry descriptor.
          # The old `--raw | sha256sum` pipeline had no pipefail: when the
          # freshly-created manifest wasn't readable yet (GHCR read-after-write
          # lag), inspect failed silently and the hash of *empty stdin*
          # (sha256:e3b0c4…) went to the attestation step, which then 404'd.
          # Retry the read, take the digest field itself, and fail the step
          # loudly if it still doesn't look like a digest.
          digest=""
          for attempt in 1 2 3 4 5; do
            digest=$(docker buildx imagetools inspect "$first_tag" --format '{{json .Manifest}}' | jq -r '.digest // empty') && [ -n "$digest" ] && break
            echo "manifest for $first_tag not readable yet (attempt $attempt); retrying..."
            sleep $((attempt * 5))
          done
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::could not read back the manifest digest for $first_tag (got: '$digest')"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Create manifest list and push for the CLI image
        id: merge-cli
        env:
          ALL_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          first_tag=""
          tags=()
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            if [[ "$tag" == "${REGISTRY}/${CLI_IMAGE}:"* ]]; then
              tags+=("-t" "$tag")
              if [ -z "$first_tag" ]; then
                first_tag="$tag"
              fi
            fi
          done <<< "$ALL_TAGS"

          sources=()
          for digest in /tmp/digests/cli/*; do
            [ -f "$digest" ] || continue
            sources+=("${REGISTRY}/${CLI_IMAGE}@sha256:$(basename "$digest")")
          done

          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          # Read the manifest-list digest back from the registry descriptor.
          # The old `--raw | sha256sum` pipeline had no pipefail: when the
          # freshly-created manifest wasn't readable yet (GHCR read-after-write
          # lag), inspect failed silently and the hash of *empty stdin*
          # (sha256:e3b0c4…) went to the attestation step, which then 404'd.
          # Retry the read, take the digest field itself, and fail the step
          # loudly if it still doesn't look like a digest.
          digest=""
          for attempt in 1 2 3 4 5; do
            digest=$(docker buildx imagetools inspect "$first_tag" --format '{{json .Manifest}}' | jq -r '.digest // empty') && [ -n "$digest" ] && break
            echo "manifest for $first_tag not readable yet (attempt $attempt); retrying..."
            sleep $((attempt * 5))
          done
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::could not read back the manifest digest for $first_tag (got: '$digest')"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Generate artifact attestation for docling-rs-serve
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.SERVE_IMAGE }}
          subject-digest: ${{ steps.merge-serve.outputs.digest }}
          push-to-registry: true

      - name: Generate artifact attestation for docling-rs
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.CLI_IMAGE }}
          subject-digest: ${{ steps.merge-cli.outputs.digest }}
          push-to-registry: true

  # ============================================================================
  # 3. CUDA GPU Build & Publish (Linux x86_64, CUDA 13 + cuDNN 9)
  # ============================================================================
  build-and-publish-cuda:
    name: build & publish CUDA (linux/amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Runs on pushes to master, releases, or dispatch with cuda=true
    if: github.event_name != 'workflow_dispatch' || (inputs.publish && inputs.cuda)
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          docker system prune -af || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        # Only log in when publishing (dispatch may opt out)
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # CUDA images are tagged exactly like the CPU ones: version tags plus :latest on a release.
      - name: Extract metadata for CUDA serve image
        id: meta_cuda_serve
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.SERVE_CUDA_IMAGE }}
          flavor: |
            latest=auto
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || github.event_name == 'release' }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
          labels: |
            org.opencontainers.image.title=docling-rs-serve-cuda
            org.opencontainers.image.description=CUDA 13 GPU document conversion API in Rust (PDF, DOCX, PPTX, XLSX, HTML, Audio)
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.vendor=docling-project

      - name: Extract metadata for CUDA CLI image
        id: meta_cuda_cli
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.CLI_CUDA_IMAGE }}
          flavor: |
            latest=auto
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || github.event_name == 'release' }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
          labels: |
            org.opencontainers.image.title=docling-rs-cuda
            org.opencontainers.image.description=docling-rs CLI (CUDA 13 GPU) — document conversion to Markdown / JSON / DCLX / LaTeX
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.vendor=docling-project

      # ------------------------------------------------------------------------
      # Local builds & smoke tests (runs on all events including PRs)
      # ------------------------------------------------------------------------
      - name: Build local CUDA CLI image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/docling-serve/Dockerfile
          target: cli-cuda
          load: true
          tags: docling-rs-cuda:test
          platforms: linux/amd64
          labels: ${{ steps.meta_cuda_cli.outputs.labels }}
          cache-from: type=gha,scope=docling-rs-serve-cuda-linux-amd64
          cache-to: type=gha,mode=max,scope=docling-rs-serve-cuda-linux-amd64

      - name: Build local CUDA serve image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/docling-serve/Dockerfile
          target: serve-cuda
          load: true
          tags: docling-rs-serve-cuda:test
          platforms: linux/amd64
          labels: ${{ steps.meta_cuda_serve.outputs.labels }}
          cache-from: type=gha,scope=docling-rs-serve-cuda-linux-amd64
          cache-to: type=gha,mode=max,scope=docling-rs-serve-cuda-linux-amd64

      # #664: the smoke tests below pass on CPU fallback even when the GPU can
      # never be used, so check the provider libraries themselves: regular
      # files (not links into the build machine's ort cache), reachable next
      # to the binaries where ONNX Runtime looks, every dependency resolved —
      # but the driver's libcuda.so.1, which the NVIDIA runtime mounts.
      - name: Check CUDA provider libraries (#664)
        run: |
          for img in docling-rs-cuda:test docling-rs-serve-cuda:test; do
            echo "Checking $img..."
            docker run --rm --entrypoint sh "$img" -ec '
              ls -la /usr/local/lib/libonnxruntime_providers_* /usr/local/bin/libonnxruntime_providers_*
              for n in shared cuda; do
                lib=/usr/local/lib/libonnxruntime_providers_$n.so
                if [ -L "$lib" ] || [ ! -f "$lib" ]; then echo "$lib is not a regular file"; exit 1; fi
                [ -f /usr/local/bin/libonnxruntime_providers_$n.so ] || { echo "no provider $n next to the binaries"; exit 1; }
              done
              missing=$(ldd /usr/local/lib/libonnxruntime_providers_cuda.so | grep "not found" | grep -v "libcuda\.so\.1" || true)
              [ -z "$missing" ] || { echo "unresolved dependencies:"; echo "$missing"; exit 1; }
            '
          done
          # A bare-name start (a Kubernetes `command:` override) re-executes
          # under the absolute path: ONNX Runtime must not look for its
          # providers in the working directory. On this GPU-less runner the
          # CUDA provider then fails for want of a device, which is fine.
          err=$(docker run --rm --entrypoint docling-rs -e DOCLING_RS_EP=cuda \
            -v "$PWD/tests/data/pdf/sources:/data:ro" docling-rs-cuda:test base14_fonts.pdf --to md 2>&1 >/dev/null || true)
          echo "$err" | tail -n 20
          if echo "$err" | grep -Eq '(/data|/app)/libonnxruntime_providers|libonnxruntime_providers_[a-z]+\.so: cannot open'; then
            echo "ONNX Runtime did not find its provider libraries next to the binary"; exit 1
          fi

      - name: Run CUDA CLI smoke test (auto fallback to CPU on GPU-less runner)
        run: |
          echo "Testing CLI execution with auto provider fallback on Markdown fixture..."
          docker run --rm -v "$PWD/tests/data/md/sources:/data:ro" docling-rs-cuda:test wiki.md --to md | head -n 3
          echo "Testing CLI execution with models resolving..."
          out=$(docker run --rm -v "$PWD/tests/data/pdf/sources:/data:ro" docling-rs-cuda:test base14_fonts.pdf --to latex)
          echo "$out" | head -n 20
          echo "$out" | grep -q '\\begin{document}' || { echo "CUDA CLI smoke test failed: no LaTeX document produced"; exit 1; }
      - name: Run CUDA serve smoke test (auto fallback to CPU on GPU-less runner)
        run: |
          echo "Starting docling-rs-serve-cuda container..."
          docker run -d --name docling-rs-serve-cuda-test -p 5001:5001 docling-rs-serve-cuda:test

          echo "Waiting for service readiness (/ready)..."
          READY=false
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5001/ready | grep -q '"status":"ready"'; then
              echo "Readiness probe OK (models warm with auto EP)"
              READY=true
              break
            fi
            echo "Waiting for container readiness ($i/60)..."
            sleep 5
          done

          if [ "$READY" != "true" ]; then
            echo "Smoke test readiness check failed! Container logs:"
            docker logs docling-rs-serve-cuda-test
            docker rm -f docling-rs-serve-cuda-test
            exit 1
          fi

          echo "Verifying /v1/config endpoint..."
          CONFIG=$(curl -sf http://localhost:5001/v1/config)
          echo "Config: $CONFIG"

          echo "Cleaning up smoke test container..."
          docker rm -f docling-rs-serve-cuda-test

      # ------------------------------------------------------------------------
      # Push images to GHCR (after the smoke tests above pass)
      # ------------------------------------------------------------------------
      - name: Push CUDA serve image to GHCR
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        id: build_cuda_serve
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/docling-serve/Dockerfile
          target: serve-cuda
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta_cuda_serve.outputs.tags }}
          labels: ${{ steps.meta_cuda_serve.outputs.labels }}
          cache-from: type=gha,scope=docling-rs-serve-cuda-linux-amd64

      - name: Push CUDA CLI image to GHCR
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        id: build_cuda_cli
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/docling-serve/Dockerfile
          target: cli-cuda
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta_cuda_cli.outputs.tags }}
          labels: ${{ steps.meta_cuda_cli.outputs.labels }}
          cache-from: type=gha,scope=docling-rs-serve-cuda-linux-amd64

      - name: Generate artifact attestation for docling-rs-serve-cuda
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.SERVE_CUDA_IMAGE }}
          subject-digest: ${{ steps.build_cuda_serve.outputs.digest }}
          push-to-registry: true

      - name: Generate artifact attestation for docling-rs-cuda
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.CLI_CUDA_IMAGE }}
          subject-digest: ${{ steps.build_cuda_cli.outputs.digest }}
          push-to-registry: true
